# Dinequora CI. Two required checks in the GitHub branch protection of main (and integration/*), so a
# regression blocks the merge: "quality" and "security". The "security" check is the gate job at the
# end: it passes only when both runs of the security suite, "security (hosted privileges)" and
# "security (cli privileges)", passed, so the protection does not change when the matrix does.
#   quality  - TypeScript, ESLint, Vitest, production build, migration journal integrity
#   security - fresh disposable Supabase (scripts/qa), migrations from zero, SQL security fixtures,
#              isolated QA tenant, permission matrix (6 profiles, store scope, tenant isolation).
#              Runs twice, once per privilege model (docs/operations/privilege-models.md):
#                hosted  only the explicit GRANTs of the migrations count, as on the Client Preview
#                        and production (the model a publication is validated against)
#                cli     the Supabase CLI defaults (older projects, the local demo and QA stacks)
# No secrets are used: the QA stack runs inside the runner with Supabase's public local keys.
# Nothing here deploys, publishes or talks to a hosted Supabase project.
name: ci

on:
  pull_request:
  push:
    branches: [main, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: ESLint
        run: npx eslint .
      - name: Vitest
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Migration journal integrity (files)
        run: node scripts/qa/check-migrations.mjs

  security:
    name: security (${{ matrix.privileges }} privileges)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        privileges: [hosted, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Supabase CLI is not a project dependency; install a pinned version on the runner.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Start disposable QA Supabase
        run: >
          supabase start --workdir scripts/qa
          -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit,storage-api,postgres-meta
      - name: Security suite
        env:
          QA_ARTIFACTS: ${{ runner.temp }}/qa
          QA_PRIVILEGE_MODEL: ${{ matrix.privileges }}
        run: bash scripts/qa/security-suite.sh
      # The database now holds every migration applied from zero: the committed types must be
      # exactly what the pinned CLI generates from it (formatted with the repository's Prettier).
      - name: Generated types match the migrations
        run: bash scripts/qa/gen-types.sh --check
      - name: Upload security reports (permission matrix, API privileges, POS sale flow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.privileges }}
          path: |
            ${{ runner.temp }}/qa/permission-matrix.txt
            ${{ runner.temp }}/qa/api-privileges.txt
            ${{ runner.temp }}/qa/api-privileges-final.txt
            ${{ runner.temp }}/qa/pos-sale-flow.txt
          if-no-files-found: ignore
      - name: Stop QA Supabase
        if: always()
        run: supabase stop --workdir scripts/qa --no-backup

  # The required "security" check. Runs even when a matrix run fails or is cancelled (a skipped job
  # would count as passing), and passes only if every run of the security suite passed.
  security-gate:
    name: security
    needs: security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both privilege models passed
        env:
          RESULT: ${{ needs.security.result }}
        run: |
          echo "security suite: $RESULT"
          test "$RESULT" = "success"
